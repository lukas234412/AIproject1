<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejestracja</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-direction: column; gap: .75rem; }
    label { display: flex; flex-direction: column; gap: .25rem; }
    input { padding: .5rem; font-size: 1rem; }
    button { padding: .5rem .9rem; font-size: 1rem; cursor: pointer; }
    .error { color: #b00020; }
    .success { color: #1b5e20; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Załóż konto</h1>

  {% if created %}
  <p class="success" role="status">Konto <strong>{{ created }}</strong> zostało utworzone. <a href="/login">Zaloguj się</a></p>
  {% endif %}

  {% if error %}
  <p class="error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/register">
    <label>Login
      <input type="text" name="login" value="{{ login }}" required minlength="3" maxlength="32"
             pattern="[A-Za-z0-9_.\-]+" autocomplete="username" autofocus>
      <small>3–32 znaki: litery, cyfry, _ . -</small>
    </label>
    <label>Hasło
      <input type="password" name="password" required minlength="8" maxlength="128"
             autocomplete="new-password">
      <small>Co najmniej 8 znaków</small>
    </label>
    <button type="submit">Zarejestruj</button>
  </form>

  <p>Masz już konto? <a href="/login">Zaloguj się</a></p>
</body>
</html>
